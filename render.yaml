# Free acceptance deployment. The database expires after 30 days; no paid resource.
services:
  - type: web
    name: echoes-music
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run music:online
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - services/music/**
        - tools/music/**
        - src/data/music/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: MUSIC_SESSION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: echoes-music-db
          property: connectionString
databases:
  - name: echoes-music-db
    plan: free
    region: singapore
    ipAllowList: []
