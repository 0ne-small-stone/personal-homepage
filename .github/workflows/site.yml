name: Site CI and Pages

on:
  push:
    branches: [main, 'codex/t13-03-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
        github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app_ready: ${{ steps.project.outputs.app_ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json

      - name: Install validation tools from lockfile
        run: npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund

      - name: Check tracked files and local documentation links
        run: npm --prefix tools/ci run check

      - name: Test project and artifact checks
        run: npm --prefix tools/ci test

      - name: Detect website readiness
        id: project
        run: node tools/ci/project.mjs

  workflows:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check GitHub Actions syntax and expressions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/site.yml

  build:
    name: Astro build
    needs: [repository, workflows]
    if: needs.repository.outputs.app_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install website dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Test article dates and related knowledge links
        run: node --test tools/content/article-date.test.mjs tools/content/knowledge-links.test.mjs

      - name: Build static website
        run: npm run build

      - name: Verify public directory routes
        run: node tools/verification/public-directory-check.mjs

      - name: Verify static output
        run: node tools/ci/dist.mjs

      - name: Save Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
