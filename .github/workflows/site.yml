name: Site CI and Pages

on:
  push:
    branches: [main, 'codex/t13-03-*', 'codex/t13-04-*', 'codex/t13-05-*', 'codex/t13-06-*', 'codex/t13-07-*', 'codex/t13-08-*', 'codex/t13-09-*', 'codex/t13-10-*', 'codex/t07-05-*', 'codex/t13-11-*', 'codex/t13-12-*', 'codex/t13-13-*', 'codex/learning-*', 'codex/content-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'source' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' ||
        github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app_ready: ${{ steps.project.outputs.app_ready }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: tools/ci/package-lock.json

      - name: Install validation tools from lockfile
        run: npm ci --prefix tools/ci --ignore-scripts --no-audit --no-fund

      - name: Check tracked files and local documentation links
        run: npm --prefix tools/ci run check

      - name: Test project and artifact checks
        run: npm --prefix tools/ci test

      - name: Detect website readiness
        id: project
        run: node tools/ci/project.mjs

  workflows:
    name: Workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check GitHub Actions syntax and expressions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/site.yml

  build:
    name: Astro build
    needs: [repository, workflows]
    if: needs.repository.outputs.app_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install website dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Prepare checksum-pinned public learning PDFs
        run: npm run materials:fetch

      - name: Refresh derived CMS candidates for validation
        # CMS writes content but does not regenerate this native select list.
        # Derive it only in this read-only checkout; no token writes back.
        run: npm run cms:sync-related

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Test gallery distribution
        run: node --test tests/gallery-distribution.test.mjs

      - name: Test content, homepage and PDF interactions
        run: node --test tests/gallery-loading.test.mjs tests/home-copy.test.mjs tools/content/pdf-immersive-input.test.mjs tools/content/pdf-load-config.test.mjs tools/content/pdf-fast-range.test.mjs tools/content/prepare-fast-pdfs.test.mjs tools/content/pdf-reader-ready.test.mjs tools/content/public-materials.test.mjs tools/content/pdf-reading-progress.test.mjs tools/content/reading-progress.test.mjs tools/content/article-date.test.mjs tools/content/knowledge-links.test.mjs tools/content/cms-auto-sync.test.mjs tests/prism-ray.test.mjs tests/home-motion-ranges.test.mjs tools/verification/immersive-pdf-layout.test.mjs tools/verification/immersive-pdf-shortcuts.test.mjs tests/home-loading.test.mjs tests/home-frame-activity.test.mjs tests/home-backdrop.test.mjs

      - name: Test music state and service boundaries
        run: npm run music:test

      - name: Test CMS editable public data
        run: node --test tools/content/public-data.test.mjs

      - name: Build static website
        run: npm run build

      - name: Test website directory with built markup
        run: node --test tests/website-directory.test.mjs

      - name: Verify gallery preview assets
        run: node tools/content/prepare-gallery-previews.mjs --check

      - name: Verify PDF first-page mirrors
        run: node tools/content/prepare-fast-pdfs.mjs --check

      - name: Verify published music catalog
        run: node tools/verification/music-catalog-check.mjs

      - name: Verify public directory routes
        run: node tools/verification/public-directory-check.mjs

      - name: Verify static output
        run: node tools/ci/dist.mjs

      - name: Verify public PDF assets and reader URLs
        run: |
          node tools/verification/public-pdf-check.mjs
          node tools/verification/public-pdf-guards.mjs

      - name: Save Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          retention-days: 7

  sync-candidates:
    name: Refresh CMS candidates
    needs: build
    if: >-
      github.repository == '0ne-small-stone/personal-homepage' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (startsWith(github.ref, 'refs/heads/codex/learning-') ||
       startsWith(github.ref, 'refs/heads/codex/content-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install candidate generator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate and safely persist native CMS choices
        run: |
          npm run cms:sync-related
          node tools/content/cms-auto-sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
