<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 33C局部曲面网格</title><style>body{background:#111;color:#ddd;margin:24px;font:16px/1.6 system-ui}a{color:#ddd}select{font:inherit;background:#222;color:#ddd;padding:8px;max-width:100%}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{display:block;max-width:100%;max-height:70vh;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>33C · 右侧光域中的曲面网格</h1><p>桌面80px、手机72px名义线距，1 CSS px细线；最终单线alpha上限.04，交叉叠加不超过.08。复用同一背景纹理与既有流体。33B照明及玻璃固定，斜转柔亮体积仍待独立解决。</p><select id="spec"></select><section><article><h2>33B旧版</h2><img id="old" alt="旧版原图"><a id="oldraw">原PNG</a></article><article><h2>33C最终候选</h2><img id="new" alt="候选原图"><a id="newraw">原PNG</a></article></section><p><a href="initial/checks.json">首批原始数据与失效减少动画等待</a> · <a href="confirm/checks.json">集中修正确认</a>。旧图沿用initial，新图来自confirm；初批交叉处偏亮及采集超时保留。</p><h2>实际输入、静止状态与背景纹理</h2><select id="other"></select><img id="action" alt="实际交互或原始Canvas纹理"><a id="actionraw">原PNG</a><pre id="data"></pre><script>const specs=['desktop-top','desktop-intro','desktop-card','mobile-top','mobile-intro','mobile-card'];const s=document.querySelector('#spec');for(const k of specs)s.add(new Option(k,k));function show(){for(const k of ['old','new']){const f=(k==='old'?'initial/':'confirm/')+k+'-'+s.value+'.png';document.querySelector('#'+k).src=f;document.querySelector('#'+k+'raw').href=f}}s.onchange=show;show();const o=document.querySelector('#other');for(const k of ['old-desktop-texture','new-desktop-texture','old-mobile-texture','new-mobile-texture','old-sweep','new-sweep','old-stopped','new-stopped','old-reverse','new-reverse','new-paused','new-reduced'])o.add(new Option(k,k));o.onchange=()=>{const f=(o.value.startsWith('old')?'initial/':'confirm/')+o.value+'.png';document.querySelector('#action').src=f;document.querySelector('#actionraw').href=f};o.onchange();fetch('confirm/checks.json').then(r=>r.json()).then(d=>document.querySelector('#data').textContent=JSON.stringify({pass:d.pass,total:d.checks.length,passed:d.checks.filter(x=>x.pass).length,browser:d.browser,limitations:d.limitations},null,2));</script></html>
