<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 35B厚度对照</title><style>body{background:#111;color:#ddd;margin:24px;font:16px/1.6 system-ui}a{color:#ddd}select{font:inherit;background:#222;color:#ddd;padding:8px}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{display:block;max-width:100%;max-height:70vh;margin:auto}pre{white-space:pre-wrap}@media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>35B · 玻璃实体加厚</h1><p>唯一变量depth .18→.30，完整Z边界约.23→.35，沿原包围盒中心校准；XY、内孔、倒角、相机和照明保持。三角体边缘光另做35C。</p><select id="spec"></select><section><article><h2>35A旧版</h2><img id="old" alt="旧厚度原图"><a id="oldraw">原PNG</a></article><article><h2>35B候选</h2><img id="new" alt="加厚原图"><a id="newraw">原PNG</a></article></section><p><a href="initial/checks.json">原始取景与实际输入记录</a></p><h2>原生转动与返回</h2><select id="other"></select><img id="action" alt="实际交互或普通材质"><pre id="data"></pre><script>const s=document.querySelector('#spec');for(const k of ['desktop-front','desktop-35','desktop-65','mobile-front','mobile-35'])s.add(new Option(k,k));s.onchange=()=>{for(const k of ['old','new']){const f='initial/'+k+'-'+s.value+'.png';document.querySelector('#'+k).src=f;document.querySelector('#'+k+'raw').href=f}};s.onchange();const o=document.querySelector('#other');for(const k of ['old-turn','new-turn','old-reverse','new-reverse','new-ordinary-material'])o.add(new Option(k,k));o.onchange=()=>document.querySelector('#action').src='initial/'+o.value+'.png';o.onchange();fetch('initial/checks.json').then(r=>r.json()).then(d=>document.querySelector('#data').textContent=JSON.stringify({pass:d.pass,total:d.checks.length,passed:d.checks.filter(x=>x.pass).length,browser:d.browser,limitations:d.limitations},null,2));</script></html>
