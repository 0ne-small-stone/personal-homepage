<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 33B光域与覆盖</title><style>body{background:#111;color:#ddd;margin:24px;font:16px/1.6 system-ui}a{color:#ddd}select{font:inherit;background:#222;color:#ddd;padding:8px;max-width:100%}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{display:block;max-width:100%;max-height:70vh;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>33B · 边缘光与竖屏覆盖</h1><p>设计侧允许保留本片背景与环境布局；35°斜转宽面仍偏暗，柔亮体积未最终通过。</p><select id="spec"></select><section><article><h2>33A旧版</h2><img id="old" alt="旧版截图"><a id="oldraw">原PNG</a></article><article><h2>33B最终候选</h2><img id="new" alt="最终候选截图"><a id="newraw">原PNG</a></article></section><p>桌面首图使用top-ready补采，其余旧图来自initial、新图来自confirm。早期桌面首图黑场及旧标题对象诊断为失效采集，不作为背景测量。</p><p><a href="initial/checks.json">首批31判据/24通过</a> · <a href="confirm/checks.json">集中修正确认29/29</a> · <a href="top-ready/checks.json">仅首图补采4/4</a></p><h2>光学通道与实际交互状态</h2><p>light/transmitted是测试时临时单独显示的通道，不能作为最终产品外观。其余为实际原生交互、降级和返回截图。SwiftShader不代表真机性能。</p><select id="other"></select><img id="action" alt="诊断通道或实际交互截图"><a id="actionraw">原PNG</a><pre id="data"></pre><script>const specs=['desktop-top','desktop-intro','desktop-angled','mobile-top','mobile-intro'];const s=document.querySelector('#spec');for(const k of specs)s.add(new Option(k,k));function show(){for(const k of ['old','new']){const folder=s.value==='desktop-top'?'top-ready':k==='old'?'initial':'confirm';const f=folder+'/'+k+'-'+s.value+'.png';document.querySelector('#'+k).src=f;document.querySelector('#'+k+'raw').href=f}}s.onchange=show;show();const o=document.querySelector('#other');for(const k of ['new-desktop-top-light','new-desktop-top-transmitted','new-desktop-angled-light','new-desktop-angled-transmitted','new-flow-injected','new-flow-stopped','new-reverse','new-low-quality','new-paused','new-project','new-project-back','new-reduced'])o.add(new Option(k,k));o.onchange=()=>{const f='confirm/'+o.value+'.png';document.querySelector('#action').src=f;document.querySelector('#actionraw').href=f};o.onchange();Promise.all(['initial','confirm','top-ready'].map(async p=>{const d=await fetch(p+'/checks.json').then(r=>r.json());return {phase:p,pass:d.pass,total:d.checks.length,passed:d.checks.filter(x=>x.pass).length}})).then(d=>document.querySelector('#data').textContent=JSON.stringify(d,null,2));</script></html>
