<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LSSH 白光体积传输</title><style>html{color-scheme:dark;background:#000;color:#ddd;font:14px "PingFang SC","Microsoft YaHei",sans-serif}body{margin:0}canvas{display:block;width:100%;height:calc(100svh - 210px)}main{padding:20px 24px}h1{font-size:18px;font-weight:500;margin:0 0 8px}p{color:#aaa;line-height:1.6;margin:8px 0;max-width:75ch}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;background:#202020;border:1px solid #444;color:#ddd;padding:8px 12px;border-radius:12px;cursor:pointer}button:focus-visible{outline:2px solid #ddd;outline-offset:3px}button:hover{background:#303030}button[aria-pressed=false]{color:#999}@media(max-width:600px){canvas{height:calc(100svh - 300px)}main{padding:16px}}</style><canvas aria-label="实际棱镜白光光子束辐射积分"></canvas><main><h1>白光体积传输</h1><p>独立单散射与接收面估计。亮点来自实际折射、Fresnel和传播衰减；关闭介质可保留受光，关闭光源则归零。连续谱、完整观察折射与首页尚未完成。</p><nav><button data-action="pause">暂停源采样</button><button data-action="volume" aria-pressed="true">切换散射介质</button><button data-action="glass" aria-pressed="true">切换玻璃</button><button data-action="turn" aria-pressed="false">转动玻璃</button><button data-action="light" aria-pressed="true">切换白光源</button><button data-action="receiver" aria-pressed="true">切换接收面</button></nav><p role="status">正在准备局部辐射积分</p></main><script type="module" src="./white-bundle.js"></script></html>
