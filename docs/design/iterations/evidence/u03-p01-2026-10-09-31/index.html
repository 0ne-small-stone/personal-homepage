<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 · 末卡退出与投影</title>
<style>body{background:#000;color:#ddd;margin:0;padding:28px;font:15px/1.6 "PingFang SC",system-ui,sans-serif}main{max-width:1440px;margin:auto}a{color:#ccc}p{color:#aaa}h1{font-size:26px}h2{font-size:19px}select{font:inherit;background:#181818;color:#ddd;border:1px solid #555;padding:8px;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}img{width:100%;height:auto;display:block}.card{background:#111;padding:12px;border-radius:10px}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}.pass{color:#b8d0bf}.fail{color:#dfb4ab}#all{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid,#all{grid-template-columns:1fr}}</style>
<main><h1>P01 · 第31轮末卡退出与投影收敛</h1><p>原生时钟；真实30旧构建与31修复。同8个滚轮delta正反向，实际接收时间分别记录。玻璃材质亮面、加载与身份纠偏另片；本轮不是全屏展开。</p>
<label>同路径点位 <select id="point"><option value="2-5500">正向5500</option><option value="3-5950">正向5950</option><option value="4-6010">越过6010</option><option value="6-5500">反向5500</option><option value="8-4600">末卡恢复4600</option></select></label><div id="compare" class="grid"></div>
<h2>确认与原失败</h2><div id="checks"></div><h2>全部原图</h2><div id="all"></div><p><a href="initial/checks.json">连续帧/第一批失败</a> · <a href="confirm/checks.json">定点确认</a></p></main>
<script>const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){$('compare').innerHTML=['old','new'].map(n=>'<div class="card"><h2>'+n+'</h2><a href="initial/'+n+'-'+$('point').value+'.png" target="_blank"><img src="initial/'+n+'-'+$('point').value+'.png"></a></div>').join('');}$('point').onchange=draw;draw();Promise.all(['confirm','initial'].map(async p=>({p,r:await(await fetch(p+'/checks.json')).json()}))).then(rows=>{$('checks').innerHTML=rows.map(({p,r})=>'<h2>'+p+' '+r.checks.filter(c=>c.pass).length+'/'+r.checks.length+'</h2>'+(r.fatal?'<p>'+esc(r.fatal)+'</p>':'')+r.checks.map(c=>'<details class="'+(c.pass?'pass':'fail')+'"><summary>'+esc((c.pass?'✓ ':'× ')+c.name)+'</summary><pre>'+esc(JSON.stringify(c.evidence,null,2))+'</pre></details>').join('')).join('');$('all').innerHTML=rows.flatMap(({p,r})=>Object.values(r.sites).flatMap(s=>s.images.map(i=>'<div class="card"><a href="'+p+'/'+i.file+'" target="_blank"><img loading="lazy" src="'+p+'/'+i.file+'"></a><p>'+esc(p+' / '+i.file)+'</p></div>'))).join('');});</script></html>
