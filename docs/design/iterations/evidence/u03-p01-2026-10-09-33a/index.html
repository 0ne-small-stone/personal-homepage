<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 33A比例对照</title><style>body{background:#111;color:#ddd;margin:24px;font:16px/1.6 system-ui}a{color:#ddd}select{font:inherit;background:#222;color:#ddd;padding:8px}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{display:block;max-width:100%;max-height:70vh;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>33A · 横向比例</h1><p>构造点与内孔x×1.14；桌面像素宽度约+13.74%。手机触发原有宽度适配后高度缩小。只改变几何。</p><select id="spec"></select><section><article><h2>32原版</h2><img id="old" alt="原版截图"><a id="oldraw">原PNG</a></article><article><h2>33A候选</h2><img id="new" alt="候选截图"><a id="newraw">原PNG</a></article></section><p><a href="initial/checks.json">首批原始27判据</a> · <a href="confirm/checks.json">仅无WebGL分类及真实导航确认</a></p><p>首批保留故意禁WebGL建图错误的false；功能降级通过，定点确认非预期错误0。SwiftShader不代表真机性能。</p><h2>其他实际状态</h2><select id="other"></select><img id="action" alt="原生输入或降级截图"><pre id="data"></pre><script>fetch('initial/checks.json').then(r=>r.json()).then(d=>{const s=document.querySelector('#spec');for(const k of ['desktop-top','desktop-intro','desktop-angled','mobile-top','mobile-intro'])s.add(new Option(k,k));function show(){for(const k of ['old','new']){const f='initial/'+k+'-'+s.value+'.png';document.querySelector('#'+k).src=f;document.querySelector('#'+k+'raw').href=f}document.querySelector('#data').textContent=JSON.stringify({old:d.cases['old-'+s.value].state,new:d.cases['new-'+s.value].state},null,2)}s.onchange=show;show();const o=document.querySelector('#other');for(const [k,c]of Object.entries(d.cases).filter(([k])=>k.includes('native')||k.includes('reduced')||k.includes('no-webgl')))for(const v of c.images)o.add(new Option(v.file,v.file));o.onchange=()=>document.querySelector('#action').src='initial/'+o.value;o.onchange()});</script></html>
