<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 第32轮身份证据</title><style>body{margin:32px;background:#111;color:#ddd;font:16px/1.6 system-ui}a{color:#ddd}select{font:inherit;padding:8px;background:#222;color:#ddd}img{display:block;max-width:100%;max-height:78vh;margin:20px 0;border:1px solid #444}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{margin-right:20px}</style><h1>第32轮：完整身份与真实导航</h1><p>26项通过。桌面1440×900 / 手机390×844，正常与减少动画。原生运行，SwiftShader不代表真机性能。</p><label>模式 <select id="mode"></select></label><label>状态 <select id="state"><option value="top">首屏</option><option value="intro">intro中点 / 普通阅读中段</option><option value="project">首卡</option></select></label><p><a id="raw">打开原PNG</a> · <a href="initial/checks.json">完整检查JSON</a></p><img id="shot" alt="实际首页截图"><pre id="details"></pre><script>fetch('initial/checks.json').then(r=>r.json()).then(d=>{const m=document.querySelector('#mode'),s=document.querySelector('#state');for(const k of Object.keys(d.cases))m.add(new Option(k,k));function show(){const c=d.cases[m.value],f=m.value+'-'+s.value+'.png',v=c.images.find(x=>x.file===f);document.querySelector('#shot').src='initial/'+f;document.querySelector('#raw').href='initial/'+f;document.querySelector('#details').textContent=JSON.stringify({bundle:c.bundle,screenshot:v,checks:d.checks.filter(x=>x.name.startsWith(m.value)).map(x=>({name:x.name,pass:x.pass}))},null,2)}m.onchange=s.onchange=show;show()});</script></html>
