<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>椭球与影像空间 · Little Stone Still Here</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="experience" data-view="loading">
    <div id="stage"></div>
    <div id="dome-host"></div>
    <div class="shade" aria-hidden="true"></div>
    <header>
      <div class="header-controls">
        <button id="return" class="quiet overview-return" aria-label="返回总览" title="返回总览" disabled>
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="16" cy="16" r="12"/>
            <ellipse cx="16" cy="16" rx="5.5" ry="12"/>
            <path d="M4 16h24M6 9.3c6 3.5 14 3.5 20 0M6 22.7c6-3.5 14-3.5 20 0"/>
          </svg>
        </button>
      </div>
    </header>
    <section id="loading" class="loading" aria-live="polite">
      <p id="loading-text">正在展开照片</p>
      <progress id="load-progress" max="36" value="0" aria-label="图片加载进度"></progress>
    </section>
    <section id="fallback" hidden><p>当前浏览器无法开启三维空间，可在这里查看照片。</p><div id="fallback-photos"></div></section>
    <footer>
      <div class="caption">
        <h1>Afterimage</h1>
        <p class="concept-intro">光已离开，影像仍在这里。</p>
        <output id="mode" class="sr-only" aria-live="polite">椭球总览</output>
        <p id="hint" class="sr-only">上下左右拖动旋转 · 点击选中 · 滚轮进入</p>
      </div>
      <div class="navigation">
        <div class="selection"><span id="selection">尚未选中照片</span><button id="view-photo" class="quiet" disabled>查看照片</button></div>
        <div class="zoom-controls">
          <button id="zoom-out" aria-label="缩小">−</button>
          <input id="journey" type="range" min="0" max="100" value="0" aria-label="椭球到空间的展开进度">
          <button id="zoom-in" aria-label="放大">+</button>
          <button id="enter" class="primary">进入空间</button>
        </div>
      </div>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
