<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 · 黑场流体对照</title>
<style>body{margin:0;padding:28px;background:#000;color:#ddd;font:15px/1.6 "PingFang SC",system-ui,sans-serif}main{max-width:1400px;margin:auto}h1{font-size:25px}h2{font-size:19px}a{color:#ddd}select,button{font:inherit;color:#ddd;background:#181818;border:1px solid #555;border-radius:9px;padding:7px;margin:4px}p{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#111;padding:12px;border-radius:12px;min-width:0}img{display:block;width:100%;height:auto}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}svg{width:100%;height:170px}.pass{color:#b8d0bf}.fail{color:#dfb4ab}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #333;padding:7px}summary{cursor:pointer}#all{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid,#all{grid-template-columns:1fr}}</style>
<main><h1>P01 · 第30轮黑场流体</h1><p>实际29旧构建 → 同一Canvas的整屏复制/flow采样 → 清晰前景。初批失败原样保留；确认、设计复核、用户确认分别记录。软件GPU不能证明真机性能。</p>
<h2>最终归因</h2><div id="closure"></div><p>原批次 fail 不改为 pass。零场550/1350与前景逐像素一致；S0差异仅为独立DOM箭头。连续返回资源未超过预热基线，最后两次一致。下方保留各轮原始结果。</p>
<label>批次 <select id="phase"><option>confirm</option><option>targeted</option><option>resource-closure</option><option>initial</option></select></label><label>路径 <select id="path"><option>kv-fast</option><option>kv-slow</option><option>intro-fast</option><option>intro-slow</option></select></label><label>停手请求 <select id="time"><option>0</option><option>250</option><option>1000</option><option>2000</option></select> ms</label><button id="play">按时间点播放</button>
<div id="compare" class="grid"></div><h2>连续输入曲线</h2><p>横轴为浏览器实际收到时间；灰线原站、白线本站。曲线是输入buffer模长，不是画面亮度。停手后弱源可能延续，流场消散从峰值判断。</p><div id="curve"></div>
<h2>判据与实际证据</h2><div id="checks"></div><h2>全部原图</h2><div id="all"></div><p><a href="confirm/checks.json">确认完整JSON</a> · <a href="initial/checks.json">初批失败完整JSON</a></p></main>
<script>
let r,playing;const $=id=>document.getElementById(id);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){r=await(await fetch($('phase').value+'/checks.json')).json();$('checks').innerHTML='<p>通过 '+r.checks.filter(c=>c.pass).length+' / '+r.checks.length+(r.fatal?'；批次中断：'+esc(r.fatal):'')+'</p>'+r.checks.map(c=>'<details class="'+(c.pass?'pass':'fail')+'"><summary>'+esc(c.pass?'✓ ':'× ')+esc(c.name)+'</summary><pre>'+esc(JSON.stringify(c.evidence,null,2))+'</pre></details>').join('');$('all').innerHTML=Object.entries(r.sites).flatMap(([site,s])=>(s.images||[]).map(i=>'<div class="card"><a href="'+$('phase').value+'/'+i.file+'" target="_blank"><img loading="lazy" src="'+$('phase').value+'/'+i.file+'"></a><p>'+esc(site+' · '+i.file)+'</p></div>')).join('');draw();}
function draw(){const entries=['source','local'].map(n=>({n,s:r.sites[n]?.segments.find(s=>s.name===$('path').value)}));$('compare').innerHTML=entries.map(({n,s})=>{const shot=s?.shots.find(i=>i.mark.ms===Number($('time').value));return '<div class="card"><h2>'+esc(n)+'</h2>'+(shot?'<a href="'+$('phase').value+'/'+shot.file+'" target="_blank"><img src="'+$('phase').value+'/'+shot.file+'"></a><p>请求 '+shot.mark.ms+' ms；实际当帧 '+(shot.state.received-s.stop).toFixed(1)+' ms；energy '+shot.state.probe.energy.toFixed(3)+'；max '+shot.state.probe.max.toFixed(3)+'</p>':'暂无')+'</div>';}).join('');const max=Math.max(...entries.flatMap(e=>e.s?.frames.map(f=>Math.hypot(...f.input.buffer))||[0]),.001),span=Math.max(...entries.map(e=>e.s?e.s.frames.at(-1).received-e.s.frames[0].received:0),1);$('curve').innerHTML='<svg viewBox="0 0 1000 170" role="img" aria-label="输入buffer连续曲线">'+entries.map(({n,s})=>'<polyline fill="none" stroke="'+(n==='local'?'#eee':'#777')+'" stroke-width="2" points="'+(s?.frames.map(f=>[(f.received-s.frames[0].received)/span*980+10,160-Math.hypot(...f.input.buffer)/max*150].join(',')).join(' ')||'')+'"/>').join('')+'</svg>';}
$('phase').onchange=load;$('path').onchange=draw;$('time').onchange=draw;$('play').onclick=()=>{clearInterval(playing);let n=0;playing=setInterval(()=>{$('time').selectedIndex=n++;draw();if(n===4)clearInterval(playing);},800);};load();fetch('closure-analysis.json').then(r=>r.json()).then(r=>{$('closure').innerHTML=r.checks.map(c=>'<details class="'+(c.pass?'pass':'fail')+'"><summary>'+esc(c.pass?'✓ ':'× ')+esc(c.name)+'</summary><pre>'+esc(JSON.stringify(c.evidence,null,2))+'</pre></details>').join('')+'<p><a href="closure-analysis.json">归因JSON</a> · <a href="targeted/checks.json">定点补验与受控60Hz</a> · <a href="resource-closure/checks.json">资源连续帧</a></p>';});
</script></html>
