<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 35C 边缘光</title><style>body{margin:24px;background:#111;color:#ddd;font:16px/1.6 system-ui}a{color:#ddd}select{padding:8px;background:#222;color:#ddd;font:inherit}section{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{display:block;max-width:100%;max-height:70vh;margin:auto}pre{white-space:pre-wrap}@media(max-width:700px){section{grid-template-columns:1fr}}</style><h1>35C · 三角体边缘光</h1><p>光附着原模型；撤去背景灯斑。集中修正仅让光核和软晕随媒体入场一起收弱、反向恢复。初批原图与原始失败保持。</p><select id="spec"></select><section><article><h2>集中修正前</h2><img id="initial" alt="初批原图"><a id="initialraw">原PNG</a></article><article><h2>集中修正后</h2><img id="confirm" alt="修正后原图"><a id="confirmraw">原PNG</a></article></section><h2>全部原始取景</h2><select id="other"></select><img id="action" alt="实际采集的原始图像"><p><a href="initial/checks.json">初批24项</a> · <a href="confirm/checks.json">确认原始13项</a> · <a href="confirmation-diagnosis.json">精确等值采样归因</a></p><pre id="data"></pre><script>const s=document.querySelector('#spec');for(const k of ['desktop-front','mobile-front','mobile-intro','desktop-card'])s.add(new Option(k,k));s.onchange=()=>{for(const k of ['initial','confirm']){const f=k+'/new-'+s.value+'.png';document.querySelector('#'+k).src=f;document.querySelector('#'+k+'raw').href=f}};s.onchange();const o=document.querySelector('#other');o.onchange=()=>document.querySelector('#action').src=o.value;Promise.all(['initial/checks.json','confirm/checks.json','confirmation-diagnosis.json'].map(p=>fetch(p).then(r=>r.json()))).then(([a,b,d])=>{for(const [key,v]of [['initial',a],['confirm',b]])for(const c of Object.values(v.cases))for(const i of c.images)o.add(new Option(key+'/'+i.file,key+'/'+i.file));o.value='confirm/new-mobile-native-card.png';o.onchange();document.querySelector('#data').textContent=JSON.stringify({initial:{pass:a.pass,total:a.checks.length},confirm:{pass:b.pass,passed:b.checks.filter(x=>x.pass).length,total:b.checks.length},diagnosis:{pass:d.pass,checks:d.checks},limitations:b.limitations},null,2)});</script></html>
