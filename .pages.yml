# T13.01: one existing article draft; native Pages CMS hosted UI.
content:
  - name: article-draft
    label: 文章草稿验证
    type: file
    path: src/content/docs/knowledge/blog/editor-draft-check.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: date
        label: 文章日期
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: topics
        label: 主题
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿（本轮固定开启）
        description: 保存后仍是草稿，不会出现在网站的文章列表、学习总览或搜索中。
        type: boolean
        default: true
        readonly: true
      - name: entryId
        type: string
        hidden: true
        readonly: true
      - name: kind
        type: string
        hidden: true
        readonly: true
      - name: example
        type: boolean
        hidden: true
        readonly: true
      - name: body
        label: 正文
        description: 可切换 Editor 与 Source 编辑；使用 Markdown 保存。本轮先验证文字、章节、链接和代码。
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: false
settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      update: 'content(article): 保存草稿 {path}'
