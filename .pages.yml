# Native article, resource and note editors, plus the fixed article validation entry.
media:
  - name: article-images
    label: 文章图片（公开仓库）
    input: src/assets/article-images
    # Articles remain directly in src/content/docs/knowledge/blog/ (no subfolders).
    output: ../../../../assets/article-images
    extensions: [png, jpg, jpeg, webp, avif]
    rename: random
    commit:
      templates:
        create: 'content(media): 上传文章图片 {filename}'
        update: 'content(media): 更新文章图片 {filename}'
        delete: 'content(media): 删除文章图片 {filename}'
        rename: 'content(media): 重命名文章图片 {oldFilename} -> {newFilename}'
  - name: note-images
    label: 笔记图片（共用公开图库）
    input: src/assets/article-images
    output: ../../../../../assets/article-images
    extensions: [png, jpg, jpeg, webp, avif]
    rename: random
content:
  - name: blog-settings
    label: 博客设置
    type: file
    path: src/data/blog-settings.json
    format: json
    commit:
      templates:
        update: 'config(blog): 更新博客标签浏览设置'
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: tagBrowsingEnabled
        label: 启用标签浏览
        type: boolean
        default: true
        description: '开启显示文章标签和标签页；关闭隐藏标签浏览入口，保留原始标签。Save 后需构建发布才能更新正式网站。'
  - name: resources
    label: 学习资料（说明编辑）
    type: collection
    path: src/content/docs/knowledge/resources
    format: yaml-frontmatter
    subfolders: true
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: 'content(resource): 保存资料说明 {path}'
    view:
      fields: [title, topics]
      primary: title
      sort: [title]
      search: [title, description]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        description: '编辑已有资料的说明。先 Save 成功再离开；正式网站需构建发布才能更新。'
      - name: description
        label: 摘要
        type: text
        required: true
      - name: topics
        label: 主题
        type: string
        list: true
        description: '用于学习总览分类。更改标题或主题后，关联候选需由开发者同步。'
  - name: notes
    label: 收藏笔记（说明编辑）
    type: collection
    path: src/content/docs/knowledge/notes
    exclude: [writing/**]
    format: yaml-frontmatter
    subfolders: true
    operations:
      create: false
      rename: false
      delete: false
    commit:
      templates:
        update: 'content(note): 保存笔记说明 {path}'
    view:
      fields: [title, topics]
      primary: title
      sort: [title]
      search: [title, description]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
        description: '编辑本站收藏说明。原站或 PDF 正文使用已有阅读入口，本站说明正文不在此编辑。先 Save 成功再离开；正式网站需构建发布才能更新。'
      - name: description
        label: 摘要
        type: text
        required: true
      - name: topics
        label: 主题
        type: string
        list: true
        description: '用于学习总览分类。更改标题或主题后，关联候选需由开发者同步。'
  - name: articles
    label: 文章
    type: collection
    path: src/content/docs/knowledge/blog
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: '{fields.entryId}.md'
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      fields: [title, draft, date]
      primary: title
      sort: [date, title]
      search: [title, description]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        description: '先 Save 成功再离开。保存失败时先备份已改字段与 Source 正文；如提示版本冲突，再刷新、对照最新内容恢复修改并重试。返回列表会放弃未保存内容。'
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: entryId
        label: 地址标识
        description: 新建时填写唯一的小写英文、数字或短横线，例如 article-reading-notes。保存后请保持此值；修改标题不会改变文章地址。
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: 使用小写英文、数字和单个短横线，不能含空格或中文。
      - name: date
        label: 文章日期
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: topics
        label: 主题
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: related
