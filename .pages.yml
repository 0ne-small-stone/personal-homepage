# T13.03: one existing article, native draft state and Markdown image uploads.
media:
  - name: article-images
    label: 文章图片（公开仓库）
    input: src/assets/article-images
    # Relative to this fixed draft's src/content/docs/knowledge/blog/ folder.
    output: ../../../../assets/article-images
    extensions: [png, jpg, jpeg, webp, avif]
    rename: random
    commit:
      templates:
        create: 'content(media): 上传文章图片 {filename}'
        update: 'content(media): 更新文章图片 {filename}'
        delete: 'content(media): 删除文章图片 {filename}'
        rename: 'content(media): 重命名文章图片 {oldFilename} -> {newFilename}'
content:
  - name: article-draft
    label: 文章编辑与发布验证
    type: file
    path: src/content/docs/knowledge/blog/editor-draft-check.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: date
        label: 文章日期
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: topics
        label: 主题
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        description: 开启时不生成生产文章页面；关闭表示提交发布。保存后先构建，通过 PR 合并并部署成功后才正式上线。重新开启需再次合并部署才能下线。
        type: boolean
        default: true
      - name: entryId
        type: string
        hidden: true
        readonly: true
      - name: kind
        type: string
        hidden: true
        readonly: true
      - name: example
        type: boolean
        hidden: true
        readonly: true
      - name: body
        label: 正文
        description: 可切换 Editor 与 Source。图片上传后填写替代文本和图下说明；建议小于 1 MiB。上传立即写入公开仓库，正文仍需保存。保存工作分支触发构建，正式网站更新以部署结果为准。
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: article-images
settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      update: 'content(article): 保存文章 {path}'
