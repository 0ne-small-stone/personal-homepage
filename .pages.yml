# T13.04: native article collection plus the existing fixed validation entry.
media:
  - name: article-images
    label: 文章图片（公开仓库）
    input: src/assets/article-images
    # Articles remain directly in src/content/docs/knowledge/blog/ (no subfolders).
    output: ../../../../assets/article-images
    extensions: [png, jpg, jpeg, webp, avif]
    rename: random
    commit:
      templates:
        create: 'content(media): 上传文章图片 {filename}'
        update: 'content(media): 更新文章图片 {filename}'
        delete: 'content(media): 删除文章图片 {filename}'
        rename: 'content(media): 重命名文章图片 {oldFilename} -> {newFilename}'
content:
  - name: articles
    label: 文章
    type: collection
    path: src/content/docs/knowledge/blog
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: '{fields.entryId}.md'
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      fields: [title, draft, date]
      primary: title
      sort: [date, title]
      search: [title, description]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        description: '先 Save 成功再离开。保存失败时先备份已改字段与 Source 正文；如提示版本冲突，再刷新、对照最新内容恢复修改并重试。返回列表会放弃未保存内容。'
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: entryId
        label: 地址标识
        description: 新建时填写唯一的小写英文、数字或短横线，例如 article-reading-notes。保存后请保持此值；修改标题不会改变文章地址。
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          message: 使用小写英文、数字和单个短横线，不能含空格或中文。
      - name: date
        label: 文章日期
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: topics
        label: 主题
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        description: 新文章默认草稿。关闭后保存表示发布候选，需构建通过、PR 合并及部署成功才正式上线。
        type: boolean
        default: true
      - name: kind
        type: string
        default: article
        hidden: true
        readonly: true
      - name: example
        type: boolean
        default: false
        hidden: true
        readonly: true
      - name: body
        label: 正文
        description: 'Editor 空行输入 / → Image；仅支持 PNG、JPG、JPEG、WebP、AVIF。格式错误请换图重试，勿刷新未保存正文。Close/Esc 取消后点击正文继续；取消不撤回已上传图片。Upload 选图即写入公开仓库。选中正文图片点 ALT，填描述后 Enter 应用，再 Save 正文；图下说明另写。链接：选中文字点链接图标，填地址后 Enter，再 Save；Source 可改文字/地址。'
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: article-images
  - name: article-draft
    label: 文章编辑与发布验证
    type: file
    path: src/content/docs/knowledge/blog/editor-draft-check.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: 标题
        description: '先 Save 成功再离开。保存失败时先备份已改字段与 Source 正文；如提示版本冲突，再刷新、对照最新内容恢复修改并重试。返回列表会放弃未保存内容。'
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: date
        label: 文章日期
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: topics
        label: 主题
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: draft
        label: 草稿
        description: 开启时不生成生产文章页面；关闭表示提交发布。保存后先构建，通过 PR 合并并部署成功后才正式上线。重新开启需再次合并部署才能下线。
        type: boolean
        default: true
      - name: entryId
        type: string
        hidden: true
        readonly: true
      - name: kind
        type: string
        hidden: true
        readonly: true
      - name: example
        type: boolean
        hidden: true
        readonly: true
      - name: body
        label: 正文
        description: 'Editor 空行输入 / → Image；仅支持 PNG、JPG、JPEG、WebP、AVIF，建议小于 1 MiB。格式错误请换图重试，勿刷新未保存正文。Close/Esc 取消后点击正文继续；取消不撤回已上传图片。Upload 选图即写入公开仓库。选中正文图片点 ALT，填描述后 Enter 应用，再 Save 正文；图下说明另写。链接：选中文字点链接图标，填地址后 Enter，再 Save；Source 可改文字/地址。'
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: article-images
settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: 'content(article): 新建文章 {path}'
      update: 'content(article): 保存文章 {path}'
